services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: to_study
      POSTGRES_USER: to_study
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U to_study -d to_study"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
