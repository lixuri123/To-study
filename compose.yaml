name: qingjian

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: qingjian:${QINGJIAN_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    volumes:
      - type: bind
        source: ${QINGJIAN_DATA_DIR:-./docker-data}
        target: /app/data
    ports:
      - "${QINGJIAN_BIND_ADDRESS:-127.0.0.1}:${QINGJIAN_PORT:-8000}:8000"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
