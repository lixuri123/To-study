[package]
name = "qingjian-desktop"
version = "0.3.0"
description = "Qingjian Windows desktop shell"
edition = "2021"

[lib]
name = "qingjian_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "2"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"
